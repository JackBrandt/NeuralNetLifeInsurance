steps:
# Step 1: Build the image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', 'gcr.io/$PROJECT_ID/streamlit-app',
    '-f', '.devcontainer/Dockerfile',  # Add this line
    '.'
  ]

# Step 2: Push the image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${PROJECT_ID}/streamlit-app']

# Step 3: Deploy to Cloud Run
- name: 'gcr.io/cloud-builders/gcloud'
  args: [
    'run', 'deploy', 'streamlit-app',
    '--image', 'gcr.io/${PROJECT_ID}/streamlit-app',
    '--region', 'us-central1',
    '--platform', 'managed',
    '--allow-unauthenticated'
  ]

images: ['gcr.io/${PROJECT_ID}/streamlit-app']